# ESPHome configuration for Climate Control Display
# https://github.com/GargIT/climate-control-display
# Tested with ESPHome 2026.11
#
# Hardware: Wireless-Tag WT32-SC01 PLUS (ZX3D50CE08S-v15-USRC)
#   ESP32-S3, 16MB flash, 2MB PSRAM (quad), WiFi + BLE
#   3.5" 480x320 ST7796 display, 8-bit i80 bus (built-in mipi_spi driver)
#   FT6336U capacitive touch (I2C)
#
# Everything you normally change is in the CONFIG block of `substitutions`.
# UI texts live in lang/<language>.yaml.
#
# https://www.marutsu.co.jp/contents/shop/marutsu/datasheet/khe_WT32-SC01-PLUS.pdf
# https://esphome.io/components/lvgl/
# https://esphome.io/cookbook/lvgl.html

substitutions:
  ##################################################################
  # CONFIG - Update values ONLY here
  device_name: 'master-ac-display'
  friendly_name: 'Master AC Display'
  language: en                      # UI language: en, sv (see lang/)
  clock_24h: 'true'                 # 'true' = 23:59:59, 'false' = 11:59:59PM
  log_level: DEBUG

  # Home Assistant climate entity and what it supports
  climate_entity: climate.master_ac
  temp_min: '16'                    # min_temp of the climate entity
  temp_max: '30'                    # max_temp of the climate entity
  temp_step: '0.5'                  # target_temp_step of the climate entity
  power_on_mode: cool               # HVAC mode used when the power button turns the AC on
  hvac_auto_mode: heat_cool         # mode the AUTO button sends: heat_cool or auto
  # Fan modes of the climate entity, in order (fan_modes attribute)
  fan_mode_1: auto
  fan_mode_2: low
  fan_mode_3: medium
  fan_mode_4: high
  fan_mode_5: strong

  # Optional frost protection page (see home-assistant/frost_protection.yaml).
  # The page button only appears when these helpers exist in Home Assistant.
  fp_switch: input_boolean.frost_protection
  fp_start: input_number.frost_protection_start
  fp_stop: input_number.frost_protection_stop

  # Secrets and Passwords - Update values in secrets.yaml
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  fallback_password: !secret fallback_password
  ota_password: !secret ota_password
  api_key: !secret api_key_b64
  ##################################################################
  # Material Design Icons
  mdi_wifi: "\U000F05A9"
  mdi_wifi_off: "\U000F05AA"
  mdi_power: "\U000F0425"
  mdi_fire: "\U000F0238"
  mdi_snowflake: "\U000F0717"
  mdi_fan: "\U000F0210"
  mdi_fan_auto: "\U000F171D"
  mdi_fan_speed_1: "\U000F1472"
  mdi_fan_speed_2: "\U000F1473"
  mdi_fan_speed_3: "\U000F1474"
  mdi_fan_off: "\U000F081D"
  mdi_thermometer: "\U000F050F"
  mdi_thermostat_auto: "\U000F1B17"
  mdi_chevron_up: "\U000F0143"
  mdi_chevron_down: "\U000F0140"
  mdi_plus: "\U000F0415"
  mdi_minus: "\U000F0374"
  mdi_water_percent: "\U000F058E"
  mdi_snowflake_thermometer: "\U000F1A71"
  mdi_arrow_left: "\U000F004D"
  # Colors common
  color_white: "0xFFFFFF"
  color_grey: "0xa5a5a5"
  color_dark_grey: "0x282828"
  color_darker_grey: "0x212121"
  color_light_grey: "0x444444"
  color_accent: "0x18bcf2"
  color_warning: "0xd2691e"
  color_success: "0x7fff00"
  # Mode colors
  color_auto: "0x2fd1c5"
  color_cool: "0x00bfff"
  color_heat: "0xff1493"
  color_dry: "0xff8c00"
  color_fan: "0x87ceeb"
  # Temperature colors
  color_temp_current: "0x35ffe6"
  color_temp_set: "0x51a0e4"
  color_temp_ticks: "0x585858"

esphome:
  name: $device_name
  friendly_name: $friendly_name
  on_boot:
    - priority: -100
      then:
        - script.execute: turn_on_screen_light
        - wait_until:
            condition: api.connected
            timeout: 20s
        - lvgl.widget.hide: boot_screen
        - script.execute: update_connection_icon

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  flash_mode: dio
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

preferences:
  flash_write_interval: 1min

psram:
  mode: quad
  speed: 80MHz
  
packages:
  language: !include lang/${language}.yaml

logger:
  level: ${log_level}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "${device_name} Fallback"
    password: ${fallback_password}

captive_portal:

ota:
  - platform: esphome
    password: ${ota_password}

web_server:
  port: 80

debug:
  update_interval: 60s
  
api:
  encryption:
    key: ${api_key}
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.label.update:
              id: ha_status_icon_label
              text_color: ${color_white}
              text: ${mdi_wifi}
          - script.execute: update_date_time_label
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.label.update:
              id: ha_status_icon_label
              text_color: ${color_warning}
              text: ${mdi_wifi_off}
          - lvgl.label.update:
              id: date_time_label
              text: "${txt_disconnected}"

i2c:
  frequency: 400kHz
  sda: GPIO6
  scl: GPIO5
  id: touch_i2c

globals:
  - id: active_lvgl_page
    type: std::string
  - id: fan_modes
    type: std::map<int, std::pair<std::string, std::string>>
    restore_value: no
    initial_value: |-
      {
        {0, {"${fan_mode_1}", "${mdi_fan_auto}"}},
        {1, {"${fan_mode_2}", "${mdi_fan_speed_1}"}},
        {2, {"${fan_mode_3}", "${mdi_fan_speed_2}"}},
        {3, {"${fan_mode_4}", "${mdi_fan_speed_3}"}},
        {4, {"${fan_mode_5}", "${mdi_fan}"}}
      }

interval:
  - interval: 5s
    then:
      - script.execute: update_connection_icon

time:
  - platform: homeassistant
    id: hass_time
    on_time:
      - seconds: /1  # Update every second
        then:
          - script.execute: update_date_time_label

binary_sensor:
  # FP on/off from HA
  - platform: homeassistant
    entity_id: ${fp_switch}
    id: fp_enabled
    internal: true
    trigger_on_initial_state: true   # update the FP button/icon with the state HA sends on connect
    on_state:
      - lvgl.widget.show: fp_page_button
      - lvgl.label.update:
          id: fp_toggle_label
          text: !lambda 'return x ? std::string("${mdi_power} ${txt_fp_on}") : std::string("${mdi_power} ${txt_fp_off}");'
          text_color: !lambda 'return x ? lv_color_hex(${color_success}) : lv_color_hex(${color_grey});'
      - lvgl.label.update:
          id: fp_icon_label
          text_color: !lambda 'return x ? lv_color_hex(${color_accent}) : lv_color_hex(${color_grey});'

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"
    entity_category: "config"

  - platform: factory_reset
    disabled_by_default: True
    name: "ESP Factory Reset"
    id: factory_reset_all
    entity_category: "config"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      icon: mdi:ip-network
    mac_address:
      name: "Wifi MAC"
      entity_category: diagnostic
      icon: mdi:network-outline
  # HA Climate HVAC mode sensor
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: hvac_mode
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: fp_ac_state_label
            text: !lambda |-
              if (x == "heat") return std::string("${txt_ac_prefix}${txt_ac_heat}");
              if (x == "off") return std::string("${txt_ac_prefix}${txt_ac_off}");
              if (x == "cool") return std::string("${txt_ac_prefix}${txt_ac_cool}");
              if (x == "${hvac_auto_mode}") return std::string("${txt_ac_prefix}${txt_ac_auto}");
              if (x == "dry") return std::string("${txt_ac_prefix}${txt_ac_dry}");
              if (x == "fan_only") return std::string("${txt_ac_prefix}${txt_ac_fan}");
              return std::string("${txt_ac_prefix}${txt_ac_offline}");
        - script.execute:
            id: set_hvac_mode
            mode: !lambda return x;
        - script.execute: turn_on_screen_light
  # HA Climate HVAC fan mode sensor
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: fan_mode
    attribute: fan_mode
    internal: true
    on_value:
      - script.execute:
          id: set_fan_mode
          mode: !lambda return x;
      - script.execute: turn_on_screen_light
  # ESPHome Info
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
  - platform: debug
    reset_reason:
      name: Reset Reason
      disabled_by_default: True

number:
  # Display Backlight Brightness Adjust
  - platform: template
    name: "BackLight Brightness"
    optimistic: true
    id: backlight_brightness
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    initial_value: 80
    restore_value: true
    min_value: 5
    max_value: 100
    step: 5
    mode: slider
  # Screen Timeout Adjust
  - platform: template
    name: "Screen Timeout"
    optimistic: true
    id: screen_timeout
    icon: mdi:timer
    unit_of_measurement: "s"
    initial_value: 300
    restore_value: true    
    min_value: 10
    max_value: 300
    step: 5
    mode: slider

output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: GPIO45
      ignore_strapping_warning: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    icon: mdi:brightness-percent
    default_transition_length: 500ms
    restore_mode: RESTORE_AND_ON
    on_turn_on: 
      then:
        - script.execute: turn_on_screen_light
    on_turn_off: 
      then:
        - lvgl.pause:

spi:
  - type: octal
    id: octal_spi
    clk_pin: 47
    data_pins:
      - 9
      - ignore_strapping_warning: true
        number: 46
      - ignore_strapping_warning: true
        number: 3
      - 8
      - 18
      - 17
      - 16
      - 15

display:
# Settings for WT32-SC01 Plus
  - platform: mipi_spi
    model: wt32-sc01-plus
    id: device_display
    data_rate: 10MHz
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft63x6
    id: device_touchscreen
    display: device_display
    interrupt_pin: GPIO7
    # No transform: LVGL rotation below also rotates touch (same as sc01-plus.yaml)
    on_release:
      - script.stop: idle_screen_off
      - script.execute: turn_on_screen_light

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s
  - platform: wifi_signal
    name: "Wifi RSSI"
    entity_category: diagnostic
    update_interval: 60s
  # FP: start / stop temperatures from HA helpers
  - platform: homeassistant
    entity_id: ${fp_start}
    id: fp_start_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: fp_start_label
          text:
            format: "%.0f°C"
            args: [ 'x' ]
  - platform: homeassistant
    entity_id: ${fp_stop}
    id: fp_stop_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: fp_stop_label
          text:
            format: "%.0f°C"
            args: [ 'x' ]
  # HA Climate temperature sensor
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: set_temperature
    attribute: temperature
    internal: true
    on_value:
      - lvgl.indicator.update:
          id: hvac_temp_ticks
          end_value: !lambda return clamp(x, ${temp_min}.0f, ${temp_max}.0f) * 10;
      - lvgl.arc.update:
          id: hvac_temp_knob
          value: !lambda return clamp(x, ${temp_min}.0f, ${temp_max}.0f) * 10;
      - lvgl.label.update:
          id: hvac_temp_label
          text:
            format: "%.0f"
            args: [ 'x' ]
      - script.execute: turn_on_screen_light
  # HA Climate current temperature sensor
  - platform: homeassistant
    entity_id: ${climate_entity}
    id: current_temperature
    attribute: current_temperature
    internal: true
    on_value:
      - lvgl.indicator.update:
          id: current_temp_needle
          value: !lambda return clamp(x, ${temp_min}.0f, ${temp_max}.0f) * 10;
      - lvgl.label.update:
          id: current_temp_label
          text:
            format: "%.1f°C"
            args: [ 'round(x * 10) / 10' ]
      - lvgl.label.update:
          id: fp_room_temp_label
          text:
            format: "${txt_room} %.1f°C"
            args: [ 'round(x * 10) / 10' ]

font:
  - file: 'fonts/roboto-400-v1.ttf'
    glyphs: ' 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ${lang_glyphs}°.:/+-%–'
    id: roboto_reg
    size: 18
    bpp: 4
    extras:
      - file: "fonts/materialdesignicons-webfont.ttf"
        glyphs: 
          - ${mdi_wifi}
          - ${mdi_wifi_off}
          - ${mdi_snowflake_thermometer}
          - ${mdi_arrow_left}
          - ${mdi_power}
          - ${mdi_fire}
          - ${mdi_snowflake}
          - ${mdi_fan}
          - ${mdi_fan_auto}
          - ${mdi_fan_speed_1}
          - ${mdi_fan_speed_2}
          - ${mdi_fan_speed_3}
          - ${mdi_fan_off}

  - file: 'fonts/roboto-400-v1.ttf'
    glyphs: ' 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ${lang_glyphs}°.:/+-%–'
    id: roboto_med
    size: 24
    bpp: 4
    extras:
      - file: "fonts/materialdesignicons-webfont.ttf"
        glyphs: 
          - ${mdi_thermometer}
          - ${mdi_thermostat_auto}
          - ${mdi_chevron_up}
          - ${mdi_chevron_down}
          - ${mdi_plus}
          - ${mdi_minus}
          - ${mdi_water_percent}
          - ${mdi_power}
          - ${mdi_fire}
          - ${mdi_snowflake}
          - ${mdi_fan}
          - ${mdi_fan_auto}
          - ${mdi_fan_speed_1}
          - ${mdi_fan_speed_2}
          - ${mdi_fan_speed_3}
          - ${mdi_fan_off}

  - file: 'fonts/roboto-400-v1.ttf'
    glyphs: ' -0123456789.°C'
    id: roboto_huge
    size: 50
    bpp: 4

script:
  # Screen Light Script
  - id: turn_on_screen_light
    mode: restart
    then:
      - lvgl.resume:
      - light.turn_on:
          id: backlight
          brightness: !lambda return id(backlight_brightness).state / 100;       
          transition_length: 1s
  - id: idle_screen_off
    mode: restart
    then:
      - lvgl.page.show: main_page
      - light.turn_on:
            id: backlight
            brightness: 50%
            transition_length: 5s
      - delay: 30s
      - light.turn_on:
            id: backlight
            brightness: 35%
            transition_length: 5s
      - delay: 30s
      - light.turn_off:
            id: backlight
      - lvgl.pause:
          show_snow: true
  # HA connection icon
  - id: update_connection_icon
    then:
      - if:
          condition: api.connected
          then:
            - lvgl.label.update:
                id: ha_status_icon_label
                text_color: ${color_white}
                text: ${mdi_wifi}
          else:
            - lvgl.label.update:
                id: ha_status_icon_label
                text_color: ${color_warning}
                text: ${mdi_wifi_off}
  # Update Time Label (language and 12/24h from substitutions)
  - id: update_date_time_label
    then:
      - lvgl.label.update:
          id: date_time_label
          text: !lambda |-
            static const char * const day_names[] = {${txt_days}};
            static char buf[24];  // "WED 12:59:59PM" / "LÖR 23:59:59" (non-ASCII = 2 bytes)
            auto now = id(hass_time).now();
            if (!now.is_valid()) return std::string("${txt_connecting}");
            int hour = now.hour;
            const char *suffix = "";
            if (!${clock_24h}) {
              suffix = hour >= 12 ? "PM" : "AM";
              hour = hour % 12;
              if (hour == 0) hour = 12;
            }
            snprintf(buf, sizeof(buf), ${clock_24h} ? "%s %02d:%02d:%02d%s" : "%s %d:%02d:%02d%s",
                    day_names[now.day_of_week-1],
                    hour,
                    now.minute,
                    now.second,
                    suffix);
            return std::string(buf);
  # HVAC Modes UI scripts
  - id: set_hvac_mode
    parameters:
      mode: string
    then:
      # Reset other buttons to inactive color
      - lvgl.label.update:
          id: auto_button_label
          text_color: ${color_grey}
      - lvgl.label.update:
          id: cool_button_label
          text_color: ${color_grey}
      - lvgl.label.update:
          id: heat_button_label
          text_color: ${color_grey}
      - lvgl.label.update:
          id: dry_button_label
          text_color: ${color_grey}
      - lvgl.label.update:
          id: fan_only_button_label
          text_color: ${color_grey}
      # Mode Label update
      - if:
          condition:
            lambda: 'return (mode == "off" || mode == "unavailable" || mode == "unknown");'
          then:
            - lvgl.label.update:
                id: mode_label
                text: !lambda |-
                  if (mode == "off") return "${txt_off}";
                  return "${txt_offline}";
            - lvgl.label.update:
                id: power_button_label
                text_color: ${color_grey}
            - lvgl.widget.hide:
              - temp_inc_button
              - temp_dec_button
              - temp_label
              - fan_inc_button
              - fan_dec_button
              - fan_speed_roller
              - meter_ticks
              - hvac_temp_knob
              - fan_speed_label
            - lvgl.label.update:
                id: hvac_temp_label
                text_color: ${color_grey}
          else:
            - lvgl.label.update:
                id: power_button_label
                text_color: ${color_success}
            - lvgl.widget.show:
              - temp_inc_button
              - temp_dec_button
              - temp_label
              - fan_inc_button
              - fan_dec_button
              - fan_speed_roller
              - meter_ticks
              - hvac_temp_knob
              - fan_speed_label
            - lvgl.label.update:
                id: hvac_temp_label
                text_color: ${color_white}
      - if:
          condition:
            lambda: 'return mode == "${hvac_auto_mode}";'
          then:
            - lvgl.label.update:
                id: mode_label
                text: "${txt_auto}"
            - lvgl.label.update:
                id: auto_button_label
                text_color: ${color_auto}
      - if:
          condition:
            lambda: 'return mode == "cool";'
          then:
            - lvgl.label.update:
                id: mode_label
                text: "${txt_cool}"
            - lvgl.label.update:
                id: cool_button_label
                text_color: ${color_cool}
      - if:
          condition:
            lambda: 'return mode == "heat";'
          then:
            - lvgl.label.update:
                id: mode_label
                text: "${txt_heat}"
            - lvgl.label.update:
                id: heat_button_label
                text_color: ${color_heat}
      - if:
          condition:
            lambda: 'return mode == "dry";'
          then:
            - lvgl.label.update:
                id: mode_label
                text: "${txt_dry}"
            - lvgl.label.update:
                id: dry_button_label
                text_color: ${color_dry}
      - if:
          condition:
            lambda: 'return mode == "fan_only";'
          then:
            - lvgl.label.update:
                id: mode_label
                text: "${txt_fan}"
            - lvgl.label.update:
                id: fan_only_button_label
                text_color: ${color_fan}
  # Fan Modes UI scripts
  - id: set_fan_mode
    parameters:
      mode: string
    then:
      - lvgl.label.update:
          id: fan_speed_label
          text: !lambda |-
            std::string display_mode = mode;
            std::transform(display_mode.begin(), display_mode.end(), display_mode.begin(), ::toupper);
            return "${mdi_fan} " + display_mode;
      - lvgl.roller.update:
          id: fan_speed_roller
          selected_index: !lambda |-
            for (const auto& entry : id(fan_modes)) {
              if (entry.second.first == mode) return entry.first;
            }
            return 0;
  - id: cycle_fan_mode
    parameters:
      direction: string
    then:
      - lambda: |-
          int current_index = id(fan_speed_roller).get_selected_index();
          const int min_index = 0;  // auto
          const int max_index = 4;  // strong
          if (direction == "up") {
            current_index = (current_index >= max_index) ? min_index : current_index + 1;
          } else {
            current_index = (current_index <= min_index) ? max_index : current_index - 1;
          }
          id(fan_speed_roller).set_selected_index(current_index, LV_ANIM_ON);
      - homeassistant.action:
          action: climate.set_fan_mode
          data:
            entity_id: ${climate_entity}
            fan_mode: !lambda |-
              switch(id(fan_speed_roller).get_selected_index()) {
                case 0: return "${fan_mode_1}";
                case 1: return "${fan_mode_2}";
                case 2: return "${fan_mode_3}";
                case 3: return "${fan_mode_4}";
                case 4: return "${fan_mode_5}";
                default: return "${fan_mode_1}";
              }
  # FP: adjust start/stop temperature in HA (start always below stop)
  - id: fp_adjust
    parameters:
      which: string
      delta: int
    then:
      - if:
          condition:
            lambda: |-
              float start = id(fp_start_temp).state, stop = id(fp_stop_temp).state;
              if (std::isnan(start) || std::isnan(stop)) return false;
              if (which == "start") return (start + delta) < stop;
              return (stop + delta) > start;
          then:
            - homeassistant.action:
                action: !lambda 'return std::string(delta > 0 ? "input_number.increment" : "input_number.decrement");'
                data:
                  entity_id: !lambda 'return std::string(which == "start" ? "${fp_start}" : "${fp_stop}");'
  # Set HVAC Temperature UI scripts
  - id: set_hvac_temp
    parameters:
      direction: string
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${climate_entity}
            temperature: !lambda |-
              float current_temp = id(set_temperature).state;
              if (std::isnan(current_temp)) current_temp = ${temp_min};
              float step = (direction == "up") ? ${temp_step} : -${temp_step};
              return clamp(current_temp + step, ${temp_min}.0f, ${temp_max}.0f);

lvgl:
  # LVGL GUI Design
  displays: device_display
  touchscreens: device_touchscreen
  rotation: 90    # landscape 480x320, same as sc01-plus.yaml
  on_idle:
    - timeout: !lambda return id(screen_timeout).state * 1000;
      then:
        - script.execute: idle_screen_off
  bg_color: ${color_darker_grey}
  text_color: ${color_white}
  scrollbar_mode: "OFF"
  default_font: roboto_reg
  style_definitions:
    - id: style_menu_button
      align: CENTER
      bg_opa: TRANSP
      shadow_opa: TRANSP
      height: 50
      width: 50
      radius: 50%
    - id: style_menu_button_label
      align: CENTER
      y: 3
      text_font: roboto_med
    - id: style_circle_button
      bg_opa: TRANSP
      radius: 75
      outline_width: 1
      width: 50
      height: 50
    - id: style_mode_button
      bg_opa: TRANSP
      radius: 50
      outline_width: 1
      height: 35
      width: 60
      align: BOTTOM_MID
    - id: style_circle_label
      align: center
      y: 2
      text_align: center
      text_font: roboto_med
  top_layer:
    widgets:
      # Time
      - label:
          id: date_time_label
          text: "${txt_connecting}" # Time to be updated from Home Assistant time
          align: TOP_LEFT
          x: 10
          y: 10
          text_align: CENTER
          text_color: ${color_grey}
      # Wifi icon
      - label:
          id: ha_status_icon_label
          hidden: false
          align: top_right
          x: -10
          y: 10
          text_align: right
          text_color: ${color_warning}  # Wifi icon color to be updated from Home Assistant API status
          text: ${mdi_wifi_off} # Wifi icon to be updated from Home Assistant API status
          text_font: roboto_reg
      # Frost protection page button (left of wifi icon)
      - button:
          id: fp_page_button
          hidden: true    # shown once Home Assistant reports the frost protection switch
          align: TOP_RIGHT
          x: -40
          y: 2
          width: 44
          height: 36
          bg_opa: TRANSP
          shadow_opa: TRANSP
          border_width: 0
          widgets:
            - label:
                id: fp_icon_label
                align: CENTER
                text: ${mdi_snowflake_thermometer}
                text_font: roboto_reg
                text_color: ${color_grey}
          on_press:
            - if:
                condition:
                  lvgl.page.is_showing: fp_page
                then:
                  - lvgl.page.show: main_page
                else:
                  - lvgl.page.show: fp_page
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: ${color_darker_grey}
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - spinner:
                align: CENTER
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  arc_color: ${color_accent}
                  arc_width: 8
          on_press:
            - lvgl.widget.hide: boot_screen
  pages:
    - id: main_page
      widgets:
        # Arc Outer Ring only for visual effect
        - arc:
            id: arc_ring_outer
            height: 250
            width: 250
            y: -20
            align: CENTER
            arc_color: ${color_light_grey}
            arc_opa: COVER
            arc_width: 10
            arc_rounded: false
            knob:
              bg_color: ${color_white}
        # Arc Inner Ring only for visual effect
        - obj:
            id: arc_ring_inner
            height: 238
            width: 238
            y: -20
            radius: 120
            align: CENTER
            border_width: 40
            border_color: ${color_dark_grey}
            bg_color: ${color_darker_grey}
        # Meter ticks and needle
        - meter:
            id: meter_ticks
            hidden: true
            height: 248
            width: 248
            y: -20
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            scales:
              range_from: ${temp_min}0   # min °C x10
              range_to: ${temp_max}0     # max °C x10
              # Set temperature ticks background
              ticks:
                count: 27       # one tick per 0.5°C
                length: 18
                width: 2
                color: ${color_temp_ticks}
              indicators:
                # Curremt temperature needle
                - line:
                    id: current_temp_needle
                    color: ${color_temp_current}
                    width: 3
                    length: 10
                    value: ${temp_max}0 # Updated from the current temperature
                # Set temperature band (min -> set temperature), drawn over the ticks
                - arc:
                    id: hvac_temp_ticks
                    start_value: ${temp_min}0
                    end_value: 240 # Updated from the set temperature
                    color: ${color_temp_set}
                    width: 4
        # Meter inner Ring only for visual effect
        - obj:
            id: meter_ring_inner
            height: 180
            width: 180
            y: -20
            radius: 120
            align: CENTER
            border_width: 12
            border_color: ${color_dark_grey}
            bg_color: ${color_darker_grey}
        # Set temperature knob, should change with the set temperature ticks
        - arc:
            id: hvac_temp_knob
            hidden: true
            align: CENTER
            arc_opa: TRANSP
            adjustable: true
            value: 240 # 24°C (24x10) Should be the same as the set temperature needle
            min_value: ${temp_min}0
            max_value: ${temp_max}0
            width: 215
            height: 215
            y: -20
            arc_width: 16
            change_rate: 30
            indicator:
              arc_opa: TRANSP
              arc_width: 16
            knob:
              bg_color: ${color_temp_set}
              border_width: 4
              border_color: ${color_white}
            on_release:
              then:
                - homeassistant.action:
                    action: climate.set_temperature
                    data:
                      entity_id: ${climate_entity}
                      temperature: !lambda |-
                        float temp = x / 10.0;
                        return roundf(temp / ${temp_step}) * ${temp_step};
        # HVAC Modes: OFF, AUTO, HEAT, COOL
        - label:
            id: mode_label
            align: CENTER
            y: -70
            text: "---" # HVAC mode to be updated from Home Assistant climate entity
            text_font: roboto_reg
            text_color: ${color_grey}
        # Set Temperature label, should change with the set temperature knob
        - label:
            id: hvac_temp_label
            hidden: false
            align: CENTER
            y: -20
            text_font: roboto_huge
            text: "---" # Set temperature to be updated from Home Assistant climate entity
        # Celsius label only to show °C
        - label:
            id: celsius_label
            align: CENTER
            x: 60
            y: -35
            text: "°C"
        # Current Temperature label, should change with the current temperature needle
        - label:
            id: current_temp_label
            hidden: false
            align: CENTER
            y: 30 
            text: "---" # Current temperature to be updated from Home Assistant climate entity
            text_color: ${color_temp_current}
        # Fan speed label only to show fan icon
        - label:
            id: fan_speed_label
            hidden: true
            align: CENTER
            y: 78
            text_align: CENTER
            text: "---"
            text_font: roboto_reg
            text_color: ${color_grey}
        # Temperature buttons
        # HVAC increase temperature
        - button:
            id: temp_inc_button
            hidden: true
            x: 30
            y: -70
            align: LEFT_MID
            styles: style_circle_button
            widgets:
              - label:
                  styles: style_circle_label
                  text: ${mdi_plus}
            on_press:
              - script.execute:
                  id: set_hvac_temp
                  direction: "up"
        # Temperature label only to show temp con
        - label:
            id: temp_label
            hidden: true
            align: LEFT_MID
            x: 42
            y: -15
            text_align: CENTER
            text: ${mdi_thermometer}
            text_font: roboto_med
        # HVAC decrease temperature
        - button:
            id: temp_dec_button
            hidden: true
            x: 30
            y: 30
            align: LEFT_MID
            styles: style_circle_button
            widgets:
              - label:
                  styles: style_circle_label
                  text: ${mdi_minus}
            on_press:
              - script.execute:
                  id: set_hvac_temp
                  direction: "down"
        # Fan buttons
        # HVAC Fan speed increase button
        - button:
            id: fan_inc_button
            hidden: true
            x: -30
            y: -70
            align: RIGHT_MID
            styles: style_circle_button
            widgets:
              - label:
                  styles: style_circle_label
                  text: ${mdi_chevron_up}
            on_press:
              - script.execute:
                  id: cycle_fan_mode
                  direction: "up"
        # Fan speed icon roller
        - roller:
            id: fan_speed_roller
            hidden: true
            state:
              disabled: true
            align: RIGHT_MID
            x: -27
            y: -15
            anim_duration: 500ms
            text_font: roboto_med
            text_opa: TRANSP
            bg_opa: TRANSP
            border_width: 0
            text_line_space: 30
            visible_row_count: 2
            selected:
              text_font: roboto_med
              text_opa: COVER
              bg_opa: TRANSP
              border_width: 0
            options:
              - ${mdi_fan_auto}
              - ${mdi_fan_speed_1}
              - ${mdi_fan_speed_2}
              - ${mdi_fan_speed_3}
              - ${mdi_fan}
            selected_index: 0
        # HVAC Fan speed descrease button
        - button:
            id: fan_dec_button
            hidden: true
            x: -30
            y: 30
            width: 50
            height: 50
            align: RIGHT_MID
            styles: style_circle_button
            widgets:
              - label:
                  styles: style_circle_label
                  text: ${mdi_chevron_down}
            on_press:
              - script.execute:
                  id: cycle_fan_mode
                  direction: "down"
        # HVAC Mode buttons
        # POWER
        - button:
            id: power_button
            x: -180  # Leftmost position
            y: -15
            styles: style_mode_button
            widgets:
              - label:
                  id: power_button_label
                  styles: style_menu_button_label
                  text: ${mdi_power} 
                  text_color: ${color_grey}
            on_press:
              - if:
                  condition:
                    lambda: 'return id(hvac_mode).state == "off";'
                  then:
                    - homeassistant.action:
                        action: climate.set_hvac_mode
                        data:
                          entity_id: ${climate_entity}
                          hvac_mode: "${power_on_mode}"
                  else:
                    - homeassistant.action:
                        action: climate.set_hvac_mode
                        data:
                          entity_id: ${climate_entity}
                          hvac_mode: "off"
        # AUTO
        - button:
            id: auto_button
            x: -108  # -180 + 72
            y: -15
            styles: style_mode_button
            widgets:
              - label:
                  id: auto_button_label
                  styles: style_menu_button_label
                  text: ${mdi_thermostat_auto}
                  text_color: ${color_grey}
            on_press:
              - homeassistant.action:
                  action: climate.set_hvac_mode
                  data:
                    entity_id: ${climate_entity}
                    hvac_mode: "${hvac_auto_mode}"
        # COOL
        - button:
            id: cool_button
            x: -36   # -108 + 72
            y: -15
            styles: style_mode_button
            widgets:
              - label:
                  id: cool_button_label
                  styles: style_menu_button_label
                  text: ${mdi_snowflake}
                  text_color: ${color_grey}
            on_press:
              - homeassistant.action:
                  action: climate.set_hvac_mode
                  data:
                    entity_id: ${climate_entity}
                    hvac_mode: "cool"
        # HEAT
        - button:
            id: heat_button
            x: 36    # -36 + 72
            y: -15
            styles: style_mode_button
            widgets:
              - label:
                  id: heat_button_label
                  styles: style_menu_button_label
                  text: ${mdi_fire}
                  text_color: ${color_grey}
            on_press:
              - homeassistant.action:
                  action: climate.set_hvac_mode
                  data:
                    entity_id: ${climate_entity}
                    hvac_mode: "heat"
        # DRY
        - button:
            id: dry_button
            x: 108   # 36 + 72
            y: -15
            styles: style_mode_button
            widgets:
              - label:
                  id: dry_button_label
                  styles: style_menu_button_label
                  text: ${mdi_water_percent}
                  text_color: ${color_grey}
            on_press:
              - homeassistant.action:
                  action: climate.set_hvac_mode
                  data:
                    entity_id: ${climate_entity}
                    hvac_mode: "dry"
        # FAN ONLY
        - button:
            id: fan_only_button
            x: 180   # Rightmost position
            y: -15
            styles: style_mode_button
            widgets:
              - label:
                  id: fan_only_button_label
                  styles: style_menu_button_label
                  text: ${mdi_fan}
                  text_color: ${color_grey}
            on_press:
              - homeassistant.action:
                  action: climate.set_hvac_mode
                  data:
                    entity_id: ${climate_entity}
                    hvac_mode: "fan_only"
    - id: fp_page
      widgets:
        - label:
            align: TOP_MID
            y: 45
            text: "${txt_fp_title}"
            text_color: ${color_accent}
        # On/off
        - button:
            id: fp_toggle_button
            align: TOP_MID
            y: 75
            width: 300
            height: 50
            bg_opa: TRANSP
            radius: 25
            outline_width: 1
            widgets:
              - label:
                  id: fp_toggle_label
                  align: CENTER
                  text: "${mdi_power} ${txt_fp_title}"
                  text_color: ${color_grey}
            on_press:
              - homeassistant.action:
                  action: input_boolean.toggle
                  data:
                    entity_id: ${fp_switch}
        # Start heating below
        - label:
            align: TOP_LEFT
            x: 20
            y: 160
            text: "${txt_fp_start}"
        - button:
            align: TOP_RIGHT
            x: -175
            y: 145
            styles: style_circle_button
            widgets:
              - label:
                  styles: style_circle_label
                  text: ${mdi_minus}
            on_press:
              - script.execute: { id: fp_adjust, which: "start", delta: -1 }
        - label:
            id: fp_start_label
            align: TOP_RIGHT
            x: -95
            y: 155
            width: 70
            text_align: CENTER
            text_font: roboto_med
            text: "---"
        - button:
            align: TOP_RIGHT
            x: -20
            y: 145
            styles: style_circle_button
            widgets:
              - label:
                  styles: style_circle_label
                  text: ${mdi_plus}
            on_press:
              - script.execute: { id: fp_adjust, which: "start", delta: 1 }
        # Turn off above
        - label:
            align: TOP_LEFT
            x: 20
            y: 225
            text: "${txt_fp_stop}"
        - button:
            align: TOP_RIGHT
            x: -175
            y: 210
            styles: style_circle_button
            widgets:
              - label:
                  styles: style_circle_label
                  text: ${mdi_minus}
            on_press:
              - script.execute: { id: fp_adjust, which: "stop", delta: -1 }
        - label:
            id: fp_stop_label
            align: TOP_RIGHT
            x: -95
            y: 220
            width: 70
            text_align: CENTER
            text_font: roboto_med
            text: "---"
        - button:
            align: TOP_RIGHT
            x: -20
            y: 210
            styles: style_circle_button
            widgets:
              - label:
                  styles: style_circle_label
                  text: ${mdi_plus}
            on_press:
              - script.execute: { id: fp_adjust, which: "stop", delta: 1 }
        # Status line
        - label:
            id: fp_room_temp_label
            align: BOTTOM_LEFT
            x: 20
            y: -20
            text: "${txt_room} ---"
            text_color: ${color_temp_current}
        - label:
            id: fp_ac_state_label
            align: BOTTOM_MID
            y: -20
            text: "${txt_ac_prefix}---"
            text_color: ${color_grey}
        # Back
        - button:
            align: BOTTOM_RIGHT
            x: -20
            y: -10
            width: 50
            height: 40
            bg_opa: TRANSP
            shadow_opa: TRANSP
            border_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: ${mdi_arrow_left}
            on_press:
              - lvgl.page.show: main_page
